# Supabase CLI プロジェクト設定（最小構成）。
#
# 目的: Edge Function の verify_jwt をコードで固定する。
#   以前はデプロイのたびに「JWT検証を切るフラグ」を手で付ける運用で、付け忘れた
#   再デプロイ1回で「cron 起動が黙って全滅」する構造だった
#   （PULSE_V3 独立レビュー 2026-09-20 指摘）。ここで恒久化する。
#
# ⚠️ このファイルは feat/pulse-v3-p2 にも存在する（あちらが初出）。
#    本ブランチ（fix/smarthr-subdomain-rename）は pulse v3 P1/P2 を含まないが、
#    **あちらのエントリも全て載せた上位集合**にしてある。理由:
#    エントリが無い関数の既定は verify_jwt=true であり、このブランチから
#    `supabase functions deploy`（関数名なし＝全関数）を打つと、本番で
#    verify_jwt=false で動いている pulse-answer / pulse-alert-digest を
#    静かに true へ戻して、トークン回答とアラート配信を壊すため。
#    マージ時は「両方が同じパスを追加」の衝突になる。解決は和集合（内容は
#    ほぼ同一のはず）で、どのエントリも落とさないこと。
#
# ローカル開発（supabase start）は使っていない。DB 接続は `supabase link` 済みの .temp を使う。

project_id = "kgofrmfsfnxbzqkfrkqo"

# ── 本ブランチに実体がある関数 ──────────────────────────────────
# smarthr-sync  … cron から x-cron-secret で起動（2026-07-15 から verify_jwt=false 運用）。
# smarthr-alert … 同期失敗の通知（migration 0052）。pg_cron
#                 smarthr_cron_fire_sync_alert が x-cron-secret だけで呼ぶ。
#                 関数内で cron secret／JWT(smarthr_can_sync) を自前検証する。
# pulse-notify  … pg_cron（0050 pulse_cron_fire_reminders）が x-cron-secret だけで呼ぶ。
[functions.smarthr-sync]
verify_jwt = false

[functions.smarthr-alert]
verify_jwt = false

[functions.pulse-notify]
verify_jwt = false

[functions.pulse-summary]
verify_jwt = true

# x-export-secret ヘッダで自前認可（予実アプリのサーバから呼ぶ）。2026-09-20 時点の本番も false。
[functions.employees-export]
verify_jwt = false

# ── feat/pulse-v3-p2 の関数（本ブランチに実体は無いが、本番では稼働中） ──
# 実体が無いブランチから全関数デプロイを打っても設定を落とさないために残す。
# pulse-answer … #/survey?t=<token>（ログイン不要・本人専用トークンURL）からの回答を受ける。
#                認可は _shared/pulseToken.ts のトークン検証のみ。
[functions.pulse-answer]
verify_jwt = false

[functions.pulse-alert-digest]
verify_jwt = false

[functions.pulse-comment-classify]
verify_jwt = false
